<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Complaints – Rural Connect</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/chatbot.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark" style="background:#1b5e20;">
    <div class="container">
      <a class="navbar-brand" href="../index.html">Rural Connect</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button>
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" href="user-dashboard.html" data-i18n="dashboard">Dashboard</a></li>
          <li class="nav-item"><a class="nav-link" href="submit-complaint.html">Submit Complaint</a></li>
        </ul>
        <ul class="navbar-nav" id="auth-nav-links"></ul>
      </div>
    </div>
  </nav>

  <div class="container" style="margin-top:40px;">
    <h2 class="section-title">My Complaints</h2>
    <div id="complaints-list">
      <p class="text-muted">Loading your complaints...</p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script>
// Check authentication
if (!isLoggedIn()) {
  window.location.href = '../login.html';
}

(async () => {
  try {
    const complaints = await fetchMyComplaints();
    const container = document.getElementById('complaints-list');
    
    if (!complaints || complaints.length === 0) {
      container.innerHTML = '<p class="text-muted">You have not submitted any complaints yet.</p>';
      return;
    }

    container.innerHTML = complaints.map(comp => `
      <div class="card mb-3">
        <div class="card-body">
          <h5>
            ${escapeHtml(comp.title)} 
            <span class="badge ${getStatusBadge(comp.status)}">${escapeHtml(comp.status)}</span>
          </h5>
          <p class="text-muted">
            Category: ${escapeHtml(comp.category)} | 
            Location: ${escapeHtml(comp.location)}
          </p>
          <p>${escapeHtml(comp.description)}</p>
          <a href="complaint-detail.html?id=${comp._id}" class="btn btn-sm btn-outline-primary">View Details</a>
        </div>
      </div>
    `).join('');
  } catch (err) {
    document.getElementById('complaints-list').innerHTML = '<p class="text-danger">Failed to load complaints.</p>';
  }
})();

function getStatusBadge(status) {
  const badges = {
    'Submitted': 'bg-secondary',
    'Under Review': 'bg-warning',
    'In Progress': 'bg-info',
    'Resolved': 'bg-success'
  };
  return badges[status] || 'bg-secondary';
}
  </script>
  <script src="../js/language.js"></script>
  <script src="../js/chatbot.js"></script>
</body>
</html>
