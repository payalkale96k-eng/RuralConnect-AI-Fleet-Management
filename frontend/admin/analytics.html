<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Analytics – Rural Connect</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/chatbot.css">
</head>
<body class="admin-shell">
  <nav class="navbar navbar-expand-lg navbar-dark" style="background:#1b5e20;">
    <div class="container">
      <a class="navbar-brand" href="../index.html">Rural Connect</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button>
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" href="admin-dashboard.html" data-i18n="dashboard">Dashboard</a></li>
          <li class="nav-item"><a class="nav-link" href="analytics.html">Analytics</a></li>
        </ul>
        <ul class="navbar-nav" id="auth-nav-links"></ul>
      </div>
    </div>
  </nav>

  <div class="container" style="margin-top:40px;">
    <h2 class="section-title">Analytics Dashboard</h2>
    <div class="alert alert-info">
      <p class="mb-0">Analytics and reporting dashboard. Extend this page with charts and detailed statistics.</p>
    </div>
    <div id="analytics-data" class="mt-4">
      <p class="text-muted">Loading analytics...</p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script>
if (!isAdmin()) window.location.href = '../login.html';

(async () => {
  try {
    const data = await apiRequest('/analytics/overview');
    document.getElementById('analytics-data').innerHTML = `
      <div class="row">
        <div class="col-md-4 mb-3"><div class="card"><div class="card-body"><h5>Total Users</h5><h3>${data.totalUsers}</h3></div></div></div>
        <div class="col-md-4 mb-3"><div class="card"><div class="card-body"><h5>Total Complaints</h5><h3>${data.totalComplaints}</h3></div></div></div>
        <div class="col-md-4 mb-3"><div class="card"><div class="card-body"><h5>Total Schemes</h5><h3>${data.totalSchemes}</h3></div></div></div>
      </div>
    `;
  } catch (err) {
    document.getElementById('analytics-data').innerHTML = '<p class="text-danger">Failed to load analytics.</p>';
  }
})();
  </script>
  <script src="../js/language.js"></script>
  <script src="../js/chatbot.js"></script>
</body>
</html>
