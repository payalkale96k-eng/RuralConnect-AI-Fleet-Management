<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scheme Details – Rural Connect</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/chatbot.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark" style="background:#1b5e20;">
    <div class="container"><a class="navbar-brand" href="index.html">Rural Connect</a></div>
  </nav>

  <div class="container" style="margin-top:40px;">
    <h2 class="section-title" data-i18n="schemes">Scheme Details</h2>
    <div id="scheme-detail"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script>
function renderSchemeDetail(s) {
  const lang = typeof rcGetLanguage === 'function' ? rcGetLanguage() : 'en';
  const all = s.translations || {en:{name:s.name,description:s.description,benefits:s.benefits,eligibility:s.eligibility,requiredDocuments:s.requiredDocuments,applicationProcess:s.applicationProcess}};
  const labels = {
    en:{title:'Scheme Details',desc:'Description',benefits:'Benefits',eligibility:'Eligibility',docs:'Required Documents',process:'How to Apply',apply:'Apply Online',english:'English',marathi:'Marathi',hindi:'Hindi'},
    mr:{title:'योजनेचा तपशील',desc:'वर्णन',benefits:'लाभ',eligibility:'पात्रता',docs:'आवश्यक कागदपत्रे',process:'अर्ज कसा करावा',apply:'ऑनलाइन अर्ज करा',english:'English',marathi:'मराठी',hindi:'हिंदी'},
    hi:{title:'योजना विवरण',desc:'विवरण',benefits:'लाभ',eligibility:'पात्रता',docs:'आवश्यक दस्तावेज',process:'आवेदन कैसे करें',apply:'ऑनलाइन आवेदन करें',english:'English',marathi:'मराठी',hindi:'हिंदी'}
  }[lang] || {title:'Scheme Details',desc:'Description',benefits:'Benefits',eligibility:'Eligibility',docs:'Required Documents',process:'How to Apply',apply:'Apply Online',english:'English',marathi:'Marathi',hindi:'Hindi'};
  const esc = escapeHtml;
  const block = (key, title) => {
    const t=all[key]; if(!t) return '';
    return `<div class="rc-lang-panel" data-lang-panel="${key}">
      <h3>${esc(t.name || s.name)}</h3>
      <p><strong>${title.desc}:</strong> ${esc(t.description||'')}</p>
      <p><strong>${title.benefits}:</strong> ${esc(t.benefits||'')}</p>
      <p><strong>${title.eligibility}:</strong> ${esc(t.eligibility||'')}</p>
      ${Array.isArray(t.requiredDocuments)&&t.requiredDocuments.length ? `<p><strong>${title.docs}:</strong></p><ul>${t.requiredDocuments.map(d=>`<li>${esc(d)}</li>`).join('')}</ul>`:''}
      <p><strong>${title.process}:</strong> ${esc(t.applicationProcess||'')}</p>
    </div>`;
  };
  document.getElementById('scheme-detail').innerHTML = `
    <div class="card shadow-sm">
      <div class="card-body">
        <div class="d-flex flex-wrap gap-2 mb-4" role="tablist">
          <button class="btn btn-outline-success rc-scheme-tab active" data-tab="en">${labels.english}</button>
          <button class="btn btn-outline-success rc-scheme-tab" data-tab="mr">${labels.marathi}</button>
          <button class="btn btn-outline-success rc-scheme-tab" data-tab="hi">${labels.hindi}</button>
        </div>
        ${block('en', {...labels,desc:'Description'})}
        ${block('mr', {...labels,desc:'वर्णन'})}
        ${block('hi', {...labels,desc:'विवरण'})}
        ${s.applicationLink ? `<a href="${esc(s.applicationLink)}" target="_blank" rel="noopener" class="btn btn-primary-rural mt-3">${labels.apply}</a>` : ''}
      </div>
    </div>`;
  const panels=document.querySelectorAll('[data-lang-panel]');
  function show(l){panels.forEach(p=>p.style.display=p.dataset.langPanel===l?'block':'none');document.querySelectorAll('.rc-scheme-tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===l));}
  document.querySelectorAll('.rc-scheme-tab').forEach(b=>b.addEventListener('click',()=>show(b.dataset.tab)));
  show(lang);
}
(async () => {
  const params = new URLSearchParams(window.location.search);
  const id = params.get('id');
  if (!id) { document.getElementById('scheme-detail').innerHTML = '<p>Invalid scheme ID.</p>'; return; }
  try { const s = await fetchSchemeById(id); window.rcCurrentScheme=s; renderSchemeDetail(s); }
  catch(err) { document.getElementById('scheme-detail').innerHTML = '<p class="text-danger">Failed to load scheme.</p>'; }
})();
document.addEventListener('rc-language-changed',()=>{ if(window.rcCurrentScheme) renderSchemeDetail(window.rcCurrentScheme); });
  </script>
  <script src="js/language.js"></script>
  <script src="js/chatbot.js"></script>
</body>
</html>
