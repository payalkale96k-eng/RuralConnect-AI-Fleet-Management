<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Government Schemes – Rural Connect</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/chatbot.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark" style="background:#1b5e20;">
    <div class="container">
      <a class="navbar-brand" href="index.html">Rural Connect</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button>
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" href="index.html" data-i18n="home">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="about.html" data-i18n="about">About</a></li>
          <li class="nav-item"><a class="nav-link" href="schemes.html" data-i18n="schemes">Schemes</a></li>
          <li class="nav-item"><a class="nav-link" href="agriculture.html" data-i18n="agriculture">Agriculture</a></li>
          <li class="nav-item"><a class="nav-link" href="weather.html" data-i18n="weather">Weather</a></li>
        </ul>
        <ul class="navbar-nav" id="auth-nav-links"></ul>
      </div>
    </div>
  </nav>

  <div class="container" style="margin-top:40px;">
    <h2 class="section-title" data-i18n="governmentSchemes">Government Schemes</h2>
    
    <div class="row g-3 mb-4">
      <div class="col-md-6">
        <input type="text" class="form-control" id="search" data-i18n-placeholder="searchSchemes" placeholder="Search schemes...">
      </div>
      <div class="col-md-4">
        <select class="form-select" id="category">
          <option value="">All Categories</option>
          <option>Farmers</option>
          <option>Women</option>
          <option>Students</option>
          <option>Employment</option>
          <option>Housing</option>
          <option>Agriculture</option>
          <option>Health</option>
          <option>Financial Services</option>
        </select>
      </div>
      <div class="col-md-2">
        <button class="btn btn-primary-rural w-100" id="search-btn">Search</button>
      </div>
    </div>

    <div id="schemes-list" class="row">
      <div class="col-12 text-center text-muted">Loading schemes...</div>
    </div>
  </div>

  <footer>
    <div class="container">
      <div class="text-center">
        <small>&copy; 2026 Rural Connect. All rights reserved.</small>
      </div>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script>
async function loadSchemes() {
  const search = document.getElementById('search').value;
  const category = document.getElementById('category').value;
  const params = { active: 'true' };
  if (search) params.search = search;
  if (category) params.category = category;

  try {
    const schemes = await fetchSchemes(params);
    const container = document.getElementById('schemes-list');
    if (!schemes || schemes.length === 0) {
      container.innerHTML = '<div class="col-12 text-center text-muted">No schemes found.</div>';
      return;
    }
    const lang = typeof rcGetLanguage === 'function' ? rcGetLanguage() : 'en';
    const label = {en:{eligibility:'Eligibility',apply:'Apply Now',details:'Details'},mr:{eligibility:'पात्रता',apply:'अर्ज करा',details:'तपशील'},hi:{eligibility:'पात्रता',apply:'आवेदन करें',details:'विवरण'}}[lang] || {eligibility:'Eligibility',apply:'Apply Now',details:'Details'};
    container.innerHTML = schemes.map(s => {
      const t = (s.translations && s.translations[lang]) || s.translations?.en || s;
      return `
      <div class="col-md-6 mb-4">
        <div class="card h-100">
          <div class="card-body">
            <h5>${escapeHtml(t.name || s.name)}</h5>
            <p class="text-muted">${escapeHtml(t.description || s.description)}</p>
            ${t.eligibility ? `<p><strong>${label.eligibility}:</strong> ${escapeHtml(t.eligibility)}</p>` : ''}
            ${s.applicationLink ? `<a href="${escapeHtml(s.applicationLink)}" target="_blank" class="btn btn-sm btn-primary-rural">${label.apply}</a>` : ''}
            <a href="scheme-detail.html?id=${encodeURIComponent(s._id)}" class="btn btn-sm btn-outline-secondary ms-2">${label.details}</a>
          </div>
        </div>
      </div>`;
    }).join('');
  } catch (err) {
    document.getElementById('schemes-list').innerHTML = '<div class="col-12 text-danger">Failed to load schemes.</div>';
  }
}

document.getElementById('search-btn').addEventListener('click', loadSchemes);
document.addEventListener('rc-language-changed', loadSchemes);
loadSchemes();
  </script>
  <script src="js/language.js"></script>
  <script src="js/chatbot.js"></script>
</body>
</html>
